[run]
# Keep one repository-root source so Cobertura paths retain their package prefixes.
# CodeScene's PR gate must be able to map each filename back to Git's changed paths.
relative_files = True
source = .

[report]
# Preserve the existing monolith scope and add HCE; do not widen or lower its floor.
include =
    app/*
    tools/hard_currency_engine/*
